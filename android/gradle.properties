# Bộ nhớ tối đa và vùng metadata/code cache dành cho tiến trình Gradle khi build Android.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Dùng hệ thư viện AndroidX thay cho Android Support Library cũ.
android.useAndroidX=true
# Tắt biên dịch Kotlin gia tăng để ưu tiên kết quả build nhất quán theo cấu hình hiện tại.
kotlin.incremental=false
# Cờ tương thích Gradle DSL do mẫu dự án Flutter quản lý.
android.newDsl=false
# Không dùng cơ chế Kotlin tích hợp mới để giữ tương thích với toolchain hiện tại.
android.builtInKotlin=false
