name: v_monitor
description: "A new Flutter project."
# Ứng dụng nội bộ nên không phát hành nhầm thành package công khai trên pub.dev.
publish_to: "none" # Chỉ bỏ giá trị này khi có chủ đích phát hành lên pub.dev.

# Phiên bản có dạng tên_phiên_bản+số_bản_dựng. Flutter ánh xạ hai phần này sang
# versionName/versionCode trên Android, CFBundleShortVersionString/CFBundleVersion
# trên iOS và phiên bản sản phẩm/bản dựng trên Windows.
version: 1.0.0+1

# Phiên bản Dart SDK tối thiểu/tương thích được phép dùng để biên dịch dự án.
environment:
    sdk: ^3.12.2

# Các thư viện bắt buộc khi ứng dụng chạy. Không nâng phiên bản hàng loạt nếu chưa
# kiểm tra tương thích bằng `flutter pub outdated`, analyze, test và build.
dependencies:
    # Flutter SDK cung cấp framework giao diện và runtime đa nền tảng.
    flutter:
        sdk: flutter

    # Bộ biểu tượng theo phong cách iOS dùng cho các thành phần cần tương thích Cupertino.
    cupertino_icons: ^1.0.8
    # Quản lý state theo Cubit/BLoC và rebuild đúng vùng giao diện đang lắng nghe state.
    flutter_bloc: ^9.1.1
    # Hiển thị bản đồ dạng tile, marker, polyline và điều khiển camera bản đồ.
    flutter_map: ^7.0.2
    # Kiểu tọa độ, khoảng cách và phép toán kinh/vĩ độ cho bản đồ và hành trình.
    latlong2: ^0.9.1
    # Khai báo route, chuyển trang và đồng bộ URL trên web.
    go_router: ^15.1.2
    # So sánh state/model theo giá trị để tránh phát và dựng lại trạng thái không đổi.
    equatable: ^2.0.7
    # Định dạng ngày giờ, số và nội dung phụ thuộc locale.
    intl: ^0.20.2
    # Nạp và áp dụng font Google theo cấu hình giao diện hiện tại.
    google_fonts: ^6.2.1
    # Lấy thư mục dữ liệu phù hợp với từng hệ điều hành.
    path_provider: ^2.1.6
    # Ghép, tách và chuẩn hóa đường dẫn tệp theo đúng nền tảng.
    path: ^1.9.1
    # HTTP client dùng cho REST API, timeout, interceptor và xử lý lỗi mạng.
    dio: ^5.11.0
    # Kết nối WebSocket đa nền tảng để nhận cập nhật thiết bị theo thời gian thực.
    web_socket_channel: ^3.0.3
    # Mở liên kết, ứng dụng bản đồ hoặc tài nguyên ngoài bằng trình xử lý hệ thống.
    url_launcher: ^6.3.2
    # Lưu token đăng nhập trong kho bảo mật do từng nền tảng cung cấp.
    flutter_secure_storage: ^9.2.4
    # Đọc tên, phiên bản và số bản dựng để hiển thị thông tin phần mềm.
    package_info_plus: ^9.0.1

# Thư viện chỉ phục vụ phát triển và kiểm thử, không đóng vai trò nghiệp vụ lúc chạy.
dev_dependencies:
    # Framework test widget/unit đi kèm Flutter SDK.
    flutter_test:
        sdk: flutter

    # Bộ quy tắc phân tích tĩnh chuẩn nhằm phát hiện lỗi và giữ code nhất quán.
    flutter_lints: ^6.0.0
    # Tạo stream điều khiển hai chiều trong các bài kiểm thử kết nối realtime.
    stream_channel: ^2.1.4

# Cấu hình tài nguyên do Flutter đóng gói cùng ứng dụng.
flutter:
    # Đóng gói font Material Icons để các widget Icon hiển thị đúng trên mọi nền tảng.
    uses-material-design: true

    # Danh sách tài nguyên tĩnh được phép tải qua AssetBundle.
    assets:
        - assets/branding/v_monitor_logo.png
