<!DOCTYPE html>
<html>
<head>
  <!--
    Flutter build thay placeholder này bằng tham số `--base-href`. Khi triển khai
    dưới thư mục con, đường dẫn phải bắt đầu và kết thúc bằng dấu gạch chéo để mọi
    tài nguyên tương đối được tải từ đúng vị trí.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Metadata giúp bản web đã cài hoạt động như ứng dụng trên iOS. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="v_monitor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Biểu tượng trên tab trình duyệt. -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>v_monitor</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Script bootstrap tải Flutter runtime và entrypoint đã build. Thuộc tính async
    tránh chặn trình duyệt phân tích phần HTML còn lại trong lúc tải script.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
